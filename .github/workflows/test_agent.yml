name: Test Agent

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to test'
        required: true
        type: choice
        options:
          - analyze_acc
          - experiment_analyze
          - summarize_and_publish
          - all_analysis

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}

jobs:
  test-analyze-acc:
    if: ${{ inputs.agent == 'analyze_acc' || inputs.agent == 'all_analysis' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic marker-pdf pymupdf pdfplumber
      - name: Run analyze_acc
        run: |
          python scripts/run_agent.py \
            --agent analyze_acc \
            --input-dir test_data/papers/ \
            --output-dir analysis/ \
            --save-temp
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-acc
          path: analysis/
          retention-days: 1

  test-experiment-analyze:
    if: ${{ inputs.agent == 'experiment_analyze' || inputs.agent == 'all_analysis' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic marker-pdf pymupdf pdfplumber
      - name: Run experiment_analyze
        run: |
          python scripts/run_agent.py \
            --agent experiment_analyze \
            --input-dir test_data/papers/ \
            --output-dir analysis/ \
            --save-temp
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-exp
          path: analysis/
          retention-days: 1

  test-summarize:
    if: ${{ inputs.agent == 'summarize_and_publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic notion-client
      - name: Run summarize_and_publish
        run: |
          python scripts/run_agent.py \
            --agent summarize_and_publish \
            --input-dir test_data/analysis/ \
            --save-temp \
            --publish-notion
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-summary
          path: temp/
          retention-days: 1