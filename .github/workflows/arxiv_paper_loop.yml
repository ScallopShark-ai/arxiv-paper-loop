name: ArXiv Paper Loop

on:
  schedule:
    - cron: '0 8 * * 2-6'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        type: string
      save_temp:
        description: 'Save intermediate files to temp folder (for testing)'
        required: false
        type: boolean
        default: false
      paper_ids:
        description: 'Direct download mode: comma-separated arxiv IDs (e.g., "2607.12345,2607.12346")'
        required: false
        type: string

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}

jobs:
  analyze_pri:
    runs-on: ubuntu-latest
    outputs:
      paper_count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests feedparser

      - name: Set date
        id: date
        run: |
          if [ -n "${{ inputs.start_date }}" ] && [ -n "${{ inputs.end_date }}" ]; then
            echo "start_date=${{ inputs.start_date }}" >> $GITHUB_OUTPUT
            echo "end_date=${{ inputs.end_date }}" >> $GITHUB_OUTPUT
          else
            echo "start_date=$(date -d 'today -1 days' +%Y-%m-%d)" >> $GITHUB_OUTPUT
            echo "end_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Run analyze_pri agent
        run: |
          python scripts/run_agent.py \
            --agent analyze_pri \
            --output-dir papers/ \
            --start-date ${{ steps.date.outputs.start_date }} \
            --end-date ${{ steps.date.outputs.end_date }} \
            ${{ inputs.save_temp && '--save-temp' || '' }} \
            ${{ inputs.paper_ids && format('--paper-ids {0}', inputs.paper_ids) || '' }}

      - name: Count papers
        id: count
        run: |
          if [ -f "papers/no_papers.txt" ]; then
            echo "count=0" >> $GITHUB_OUTPUT
          else
            count=$(ls papers/*.pdf 2>/dev/null | wc -l || echo "0")
            echo "count=$count" >> $GITHUB_OUTPUT
          fi

      - name: Upload papers artifact
        uses: actions/upload-artifact@v4
        with:
          name: papers
          path: papers/
          retention-days: 1

      - name: Upload temp artifact
        if: ${{ inputs.save_temp }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-pri
          path: temp/
          retention-days: 1

  analyze_acc:
    needs: analyze_pri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic marker-pdf pymupdf pdfplumber
      - name: Download papers artifact
        uses: actions/download-artifact@v4
        with:
          name: papers
          path: papers/
      - name: Run analyze_acc agent
        run: |
          python scripts/run_agent.py \
            --agent analyze_acc \
            --input-dir papers/ \
            --output-dir analysis/ \
            ${{ inputs.save_temp && '--save-temp' || '' }}
      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-acc
          path: analysis/
          retention-days: 1
      - name: Upload temp artifact
        if: ${{ inputs.save_temp }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-acc
          path: temp/
          retention-days: 1

  experiment_analyze:
    needs: analyze_pri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic marker-pdf pymupdf pdfplumber
      - name: Download papers artifact
        uses: actions/download-artifact@v4
        with:
          name: papers
          path: papers/
      - name: Run experiment_analyze agent
        run: |
          python scripts/run_agent.py \
            --agent experiment_analyze \
            --input-dir papers/ \
            --output-dir analysis/ \
            ${{ inputs.save_temp && '--save-temp' || '' }}
      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-exp
          path: analysis/
          retention-days: 1
      - name: Upload temp artifact
        if: ${{ inputs.save_temp }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-exp
          path: temp/
          retention-days: 1

  extract_images:
    needs: analyze_pri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_images: ${{ steps.check.outputs.has_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pymupdf
      - name: Download papers artifact
        uses: actions/download-artifact@v4
        with:
          name: papers
          path: papers/
      - name: Extract images from PDFs
        run: |
          mkdir -p extracted_images/
          python -c "
          import os
          import sys
          sys.path.insert(0, '.claude/skills/pdf-image-extractor/scripts')
          from pdf_image_extractor import extract_images_from_directory
          results = extract_images_from_directory('papers/', 'extracted_images/')
          total = sum(len(imgs) for imgs in results.values())
          print(f'Extracted {total} images')
          "
      - name: Check if images exist
        id: check
        run: |
          if [ "$(ls -A extracted_images/ 2>/dev/null)" ]; then
            echo "has_images=true" >> $GITHUB_OUTPUT
          else
            echo "has_images=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload images to GitHub branch
        if: steps.check.outputs.has_images == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B images
          git add -f extracted_images/
          git commit -m "Add extracted images $(date +%Y-%m-%d)" || echo "No changes"
          git push -f origin images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate URL mapping
        if: steps.check.outputs.has_images == 'true'
        id: urls
        run: |
          REPO="${{ github.repository }}"
          BRANCH="images"
          echo "{" > image_urls.json
          first=true
          for img in $(find extracted_images/ -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \)); do
            filename=$(basename "$img")
            url="https://raw.githubusercontent.com/$REPO/$BRANCH/$img"
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> image_urls.json
            fi
            echo "\"$filename\": \"$url\"" >> image_urls.json
          done
          echo "}" >> image_urls.json
          cat image_urls.json
      - name: Upload URL mapping artifact
        if: steps.check.outputs.has_images == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-urls
          path: image_urls.json
          retention-days: 1

  summarize_and_publish:
    needs: [analyze_acc, experiment_analyze, extract_images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install anthropic notion-client
      - name: Download all analysis artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: analysis-*
          path: analysis/
          merge-multiple: true
      - name: Download image URL mapping
        if: needs.extract_images.outputs.has_images == 'true'
        uses: actions/download-artifact@v4
        with:
          name: image-urls
          path: ./
      - name: Run summarize_and_publish agent
        run: |
          python scripts/run_agent.py \
            --agent summarize_and_publish \
            --input-dir analysis/ \
            ${{ inputs.save_temp && '--save-temp' || '' }} \
            --publish-notion \
            ${{ needs.extract_images.outputs.has_images == 'true' && '--image-urls image_urls.json' || '' }}
      - name: Upload final temp artifact
        if: ${{ inputs.save_temp }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-final
          path: temp/
          retention-days: 1
      - name: Workflow completed
        run: echo "ArXiv Paper Loop completed successfully!"